<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>부장님과 이심전심 LIVE</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f8ff;background:#101525}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 16px 80px}h1{font-size:clamp(27px,6vw,42px);margin:8px 0}h2{margin:12px 0}p{line-height:1.6;color:#c6cde2}.card{background:#202940;border:1px solid #364260;border-radius:18px;padding:20px;margin:16px 0}.muted{color:#b4bfd9;font-size:14px}.pill{display:inline-block;padding:5px 11px;border-radius:99px;background:#3c4b75;font-size:13px}input,textarea,button{font:inherit;border-radius:12px;padding:12px;width:100%;margin:5px 0}input,textarea{background:#131b2e;color:white;border:1px solid #53617c}button{background:#6c8cff;color:#07102c;border:0;font-weight:750;cursor:pointer}button.secondary{background:#374562;color:white}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.bar{height:15px;border-radius:20px;background:#34425e;overflow:hidden}.bar>div{height:100%;background:#80a1ff}.hidden{display:none!important}.choice{min-height:74px;text-align:left;padding:18px}.choice.active{outline:3px solid #e6d57c}.rank{padding:12px;border-bottom:1px solid #45516a}.small{font-size:13px}a{color:#a6bdff}label{display:block;margin:10px 0 3px}#error{color:#ffb6b6;white-space:pre-wrap}.qr{background:white;padding:12px;display:inline-block;border-radius:12px}textarea{min-height:65px}</style></head>
<body><main><div class="pill">실시간 참여형 게임</div><h1>부장님과 이심전심 🎯</h1><p>부장님과 같은 선택을 가장 많이 한 사람은 누구일까요?</p>
<div id="error"></div><section id="setup" class="card hidden"><h2>Firebase 연결이 필요합니다</h2><p>GitHub Pages 배포는 되었지만 실시간 투표를 사용하려면 Firebase 설정을 코드에 추가해야 합니다. 저장소 index.html의 FIREBASE_CONFIG 값을 설정하세요.</p></section>
<section id="home" class="card hidden"><h2>게임 시작</h2><div class="row"><button id="host">사회자 / 관리자</button><button id="join" class="secondary">참가자 입장</button></div></section>
<section id="hostpanel" class="hidden"><div class="card"><h2>관리자</h2><p class="muted">현재 브라우저의 익명 계정이 방 관리자입니다. 브라우저 데이터를 삭제하면 관리자 권한을 잃을 수 있습니다.</p><div id="createbox"><button id="create">새 게임 만들기</button></div><div id="hostgame" class="hidden"><p>방 코드: <strong id="roomcode"></strong></p><p>참가 주소: <a id="joinlink" target="_blank"></a></p><div id="qr" class="qr"></div><p id="hoststatus"></p><p id="hostcount"></p><div id="questionedit"></div><button id="savequestions" class="secondary">질문 / 부장님 정답 저장</button><div class="row"><button id="openlobby">입장 대기</button><button id="next">다음 질문 공개</button></div><div class="row"><button id="reveal" class="secondary">현재 문항 마감 · 결과 공개</button><button id="finish" class="secondary">최종 순위 발표</button></div><div id="stats"></div><div id="leaderboard"></div></div></div></section>
<section id="joinpanel" class="card hidden"><h2>참가자 입장</h2><label>방 코드</label><input id="joincode" maxlength="8" placeholder="예: ABC123"><label>참가자 이름</label><input id="name" maxlength="20" placeholder="이름을 입력하세요"><button id="enter">입장하기</button></section>
<section id="playerpanel" class="hidden"><div class="card"><p id="playerstatus"></p><h2 id="playerquestion"></h2><div id="choices"></div><p id="voted"></p></div><div id="playerresult"></div></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,updateDoc,collection,onSnapshot,query,where,getDocs,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const FIREBASE_CONFIG={apiKey:"AIzaSyA6emhzRd_yhaXUPo_GuAyKpATtzjiswOM",authDomain:"mindmatch-live.firebaseapp.com",projectId:"mindmatch-live",storageBucket:"mindmatch-live.firebasestorage.app",messagingSenderId:"753411227032",appId:"1:753411227032:web:81191196ed4218f2063fed"};
const $=id=>document.getElementById(id), show=id=>$(id).classList.remove('hidden'), hide=id=>$(id).classList.add('hidden');
const qs=[
["로또 1등에 당첨된다면?","모르는 척 출근한다","바로 퇴사한다"],
["평생 둘 중 하나만 먹을 수 있다면?","한식","양식"],
["평생 한 계절만 산다면?","여름","겨울"],
["돈 중 하나만 받는다면?","일시금 1억 원","매달 100만 원씩 10년"],
["휴가를 떠난다면?","바다","산"],
["내 마음대로 출퇴근할 수 있다면?","매일 조금 늦게 출근","매일 조금 일찍 퇴근"],
["회식에서 더 좋은 것은?","맛있는 음식","재미있는 대화"],
["주말에 더 끌리는 것은?","집에서 휴식","밖에서 활동"],
["여행 스타일은?","계획을 꼼꼼히","즉흥적으로"],
["100억을 받는 대신 한 가지를 포기한다면?","평생 게임 금지","평생 커피 금지"]
];
let app,auth,db,user,roomId="",room=null,entries=[],votes=[],isHost=false,unsubs=[],selected=-1;
const msg=e=>{$('error').textContent=e?.message||String(e)};
const roomref=()=>doc(db,'rooms',roomId);
const encodeQuestions=questions=>questions.map(q=>({text:q[0],a:q[1],b:q[2]}));
const decodeRoom=data=>({...data,questions:(data.questions||[]).map(q=>Array.isArray(q)?q:[q.text,q.a,q.b])});
const url=()=>location.origin+location.pathname+'?room='+roomId;
function resetSubs(){unsubs.forEach(f=>f());unsubs=[]}
function renderQR(){let img=document.createElement('img');img.width=190;img.height=190;img.alt='참가자 QR';img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url());$('qr').replaceChildren(img)}
function renderEditor(){if(!room||!isHost)return;const wrap=$('questionedit');wrap.innerHTML='<h3>10개 질문과 부장님 정답</h3>';room.questions.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b>Q'+(i+1)+'</b><input data-i="'+i+'" data-k="0"><input data-i="'+i+'" data-k="1"><input data-i="'+i+'" data-k="2"><label>부장님 선택</label><select data-answer="'+i+'" style="padding:9px;background:#151c30;color:white"><option value="0">A</option><option value="1">B</option></select>';wrap.append(d);d.querySelectorAll('input').forEach((el,k)=>el.value=q[k]);d.querySelector('select').value=room.answers[i]??0})}
function tally(i){const a=votes.filter(v=>v.question===i&&v.choice===0).length,b=votes.filter(v=>v.question===i&&v.choice===1).length;return [a,b]}
function rankings(){return entries.map(e=>({...e,score:votes.filter(v=>v.uid===e.uid&&room.answers[v.question]===v.choice).length})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ko'))}
function rankHtml(){const rs=rankings();let place=0,prev=-1;return '<h2>🏆 최종 순위</h2>'+rs.map((r,i)=>{if(r.score!==prev)place=i+1;prev=r.score;return '<div class="rank">'+place+'위 · '+escapeHtml(r.name)+' — <b>'+r.score+'/10점</b></div>'}).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statsHtml(){if(room.current<0)return '';const i=room.current,[a,b]=tally(i),total=a+b,percent=n=>total?Math.round(n/total*100):0,q=room.questions[i];return '<div class="card"><h2>Q'+(i+1)+' 실시간 집계</h2><p>'+escapeHtml(q[0])+'</p><p>A. '+escapeHtml(q[1])+' · '+a+'명 ('+percent(a)+'%)</p><div class="bar"><div style="width:'+percent(a)+'%"></div></div><p>B. '+escapeHtml(q[2])+' · '+b+'명 ('+percent(b)+'%)</p><div class="bar"><div style="width:'+percent(b)+'%"></div></div><p>응답 '+total+'명 / 입장 '+entries.length+'명</p>'+(room.status==='reveal'||room.status==='finished'?'<h3>부장님 선택: '+(room.answers[i]===0?'A':'B')+'</h3>':'')+'</div>'}
function renderHost(){if(!room||!isHost)return;show('hostgame');hide('createbox');$('roomcode').textContent=roomId;$('joinlink').href=url();$('joinlink').textContent=url();renderQR();$('hoststatus').textContent='진행 상태: '+({draft:'준비',lobby:'입장 대기',question:'투표 진행',reveal:'결과 공개',finished:'최종 발표'}[room.status]||room.status)+' · '+(room.current+1)+'/10 문항';$('hostcount').textContent='참가자 '+entries.length+'명';$('stats').innerHTML=statsHtml();$('leaderboard').innerHTML=room.status==='finished'?rankHtml():'';$('next').disabled=room.status==='question'||room.current>=9||room.status==='finished';$('reveal').disabled=room.status!=='question';$('finish').disabled=room.status==='finished';$('savequestions').disabled=room.status==='question'||room.status==='finished'}
function renderPlayer(){if(!room||isHost)return;show('playerpanel');$('playerstatus').textContent=({draft:'사회자 준비 중',lobby:'잠시만 기다려 주세요',question:'지금 투표하세요!',reveal:'문항별 결과 공개',finished:'게임 종료'}[room.status]||'대기 중');const i=room.current;if(i<0){$('playerquestion').textContent='게임 시작을 기다리는 중';$('choices').innerHTML='';return}const q=room.questions[i];$('playerquestion').textContent='Q'+(i+1)+'. '+q[0];$('choices').innerHTML='';const mine=votes.find(v=>v.uid===user.uid&&v.question===i);for(let k=0;k<2;k++){const btn=document.createElement('button');btn.className='choice'+(mine?.choice===k?' active':'');btn.textContent=(k===0?'A. ':'B. ')+q[k+1];btn.disabled=room.status!=='question'||!!mine;btn.onclick=()=>cast(i,k);$('choices').append(btn)}$('voted').textContent=mine?'선택 완료! 다른 참가자의 응답을 기다려 주세요.':room.status==='question'?'하나를 선택해 주세요.':'';const [a,b]=tally(i);$('playerresult').innerHTML=room.status==='reveal'?'<div class="card"><h3>문항 결과</h3><p>A '+a+'명 / B '+b+'명</p><p>부장님 선택: '+(room.answers[i]===0?'A':'B')+'</p></div>':room.status==='finished'?'<div class="card">'+rankHtml()+'</div>':''}
async function cast(i,k){try{await setDoc(doc(db,'rooms',roomId,'votes',i+'_'+user.uid),{uid:user.uid,question:i,choice:k,createdAt:serverTimestamp()});}catch(e){msg(e)}}
function watch(){resetSubs();unsubs.push(onSnapshot(roomref(),s=>{if(!s.exists()){msg('게임을 찾을 수 없습니다.');return}const prev=room?.questions;room=decodeRoom(s.data());if(isHost){if(!prev||JSON.stringify(prev)!==JSON.stringify(room.questions))renderEditor();renderHost()}else renderPlayer()},msg));unsubs.push(onSnapshot(collection(db,'rooms',roomId,'entries'),s=>{entries=s.docs.map(x=>x.data());if(isHost)renderHost();else renderPlayer()},msg));unsubs.push(onSnapshot(collection(db,'rooms',roomId,'votes'),s=>{votes=s.docs.map(x=>x.data());if(isHost)renderHost();else renderPlayer()},msg))}
async function startHost(){isHost=true;hide('home');show('hostpanel');const saved=localStorage.getItem('mindmatch-host-room');if(saved){const snap=await getDoc(doc(db,'rooms',saved));if(snap.exists()&&snap.data().owner===user.uid){roomId=saved;room=decodeRoom(snap.data());watch();return}}}
async function create(){roomId=Math.random().toString(36).slice(2,8).toUpperCase();await setDoc(roomref(),{owner:user.uid,status:'draft',current:-1,questions:encodeQuestions(qs),answers:Array(10).fill(0),createdAt:serverTimestamp()});localStorage.setItem('mindmatch-host-room',roomId);watch()}
async function change(status,current){if(!room)return;await updateDoc(roomref(),{status,current})}
async function enter(){roomId=$('joincode').value.trim().toUpperCase();const name=$('name').value.trim();if(!/^[A-Z0-9]{6}$/.test(roomId)||!name){msg('6자리 방 코드와 이름을 입력하세요.');return}const snap=await getDoc(roomref());if(!snap.exists()){msg('방 코드를 확인하세요.');return}room=decodeRoom(snap.data());if(room.status==='finished'){msg('종료된 게임입니다.');return}await setDoc(doc(db,'rooms',roomId,'entries',user.uid),{uid:user.uid,name,joinedAt:serverTimestamp()});hide('joinpanel');localStorage.setItem('mindmatch-joined',roomId);watch()}
$('host').onclick=()=>startHost().catch(msg);$('join').onclick=()=>{hide('home');show('joinpanel')};$('create').onclick=()=>create().catch(msg);$('enter').onclick=()=>enter().catch(msg);
$('savequestions').onclick=async()=>{try{const questions=room.questions.map(q=>[...q]),answers=[...room.answers];document.querySelectorAll('[data-i]').forEach(el=>questions[+el.dataset.i][+el.dataset.k]=el.value.trim());document.querySelectorAll('[data-answer]').forEach(el=>answers[+el.dataset.answer]=+el.value);if(questions.some(q=>q.some(v=>!v))){msg('질문과 선택지를 모두 입력하세요.');return}await updateDoc(roomref(),{questions:encodeQuestions(questions),answers});alert('저장 완료')}catch(e){msg(e)}};
$('openlobby').onclick=()=>change('lobby',room.current).catch(msg);$('next').onclick=()=>change('question',room.current+1).catch(msg);$('reveal').onclick=()=>change('reveal',room.current).catch(msg);$('finish').onclick=()=>{if(confirm('최종 순위를 발표할까요?'))change('finished',room.current).catch(msg)};
if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){show('setup')}else{try{app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app);await signInAnonymously(auth);user=auth.currentUser;const param=new URLSearchParams(location.search).get('room');if(param){hide('home');show('joinpanel');$('joincode').value=param.toUpperCase()}else show('home')}catch(e){msg(e)}}
</script></body></html>
