<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이심전심 LIVE</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101626;color:#f5f7ff}main{max-width:740px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px}h2{font-size:21px}.card{background:#1d2941;border:1px solid #354462;border-radius:16px;padding:18px;margin:15px 0}.muted{color:#acb9d0}.small{font-size:13px}input,textarea,select{width:100%;padding:13px;margin:7px 0;background:#101a30;color:white;border:1px solid #51627e;border-radius:10px;font:inherit}button{padding:13px 18px;border:0;border-radius:11px;background:#5b86ff;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#34445f}.danger{background:#a94755}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{min-height:130px;font-size:20px;overflow-wrap:anywhere}.choices button.chosen{outline:4px solid #a2e8c0;background:#176b56}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.hide{display:none!important}.bar{height:13px;border-radius:10px;background:#33415d;overflow:hidden}.fill{height:100%;background:#5b86ff}.qedit{border-top:1px solid #4b5872;padding:12px 0}.error{color:#ffb0b0;white-space:pre-wrap}a{color:#a9c3ff}#people{white-space:nowrap;font-size:14px;color:#a6e6c3}label{display:block;margin-top:8px}.big{font-size:28px;font-weight:800}.center{text-align:center}@keyframes celebrate{from{transform:scale(.6);opacity:0}70%{transform:scale(1.1);opacity:1}to{transform:scale(1);opacity:1}}.award{animation:celebrate .8s ease-out}.award .big{color:#ffe58f}table{border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #45536a;white-space:nowrap}</style></head><body><main>
<header><h1>이심전심 LIVE</h1><span id="people">참가 0명</span></header><p id="error" class="error"></p>
<section id="home" class="card"><h2>이름을 입력해주세요</h2><input id="name" maxlength="20" placeholder="참가자 이름"><button id="join">참여하기</button><p class="muted small">사회자가 시작하면 모든 참가자에게 같은 문항이 표시됩니다.</p><button class="secondary" id="adminLink">사회자 로그인</button></section>
<section id="adminLogin" class="card hide"><h2>사회자 로그인</h2><p class="muted small">비밀번호는 Firebase 서버에서 검증됩니다.</p><input id="password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호"><button id="login">로그인</button><button id="back" class="secondary">돌아가기</button></section>
<section id="player" class="hide"><div class="card"><div id="playerContent"></div></div></section>
<section id="host" class="hide"><div class="card"><h2>사회자 관리</h2><p id="hostStatus" class="muted"></p><label>문항 수 (1~10)</label><select id="count"></select><div id="editor"></div><div class="row"><button id="save">문항 저장</button><button id="new" class="secondary">새 게임 만들기</button></div><p class="muted small">새 게임을 만들면 공통 참가 링크가 새 게임으로 연결됩니다.</p><div class="row"><button id="start">시작 / 다음 문항</button><button id="reveal" class="secondary">결과 공개</button><button id="finish" class="danger">종료</button></div><div id="hostResult"></div><div id="rankings"></div><div class="row"><button id="award3">3등 발표</button><button id="award2">2등 발표</button><button id="award1">1등 발표</button></div><button id="awardClear" class="secondary">발표 화면 닫기</button><p>참가 링크: <a id="link" target="_blank"></a></p><div id="qr"></div></div></section>
</main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import{getFirestore,doc,collection,query,where,setDoc,updateDoc,getDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyA6emhzRd_yhaXUPo_GuAyKpATtzjiswOM",authDomain:"mindmatch-live.firebaseapp.com",projectId:"mindmatch-live",storageBucket:"mindmatch-live.firebasestorage.app",messagingSenderId:"753411227032",appId:"1:753411227032:web:81191196ed4218f2063fed"});
const ADMIN_EMAIL='host@mindmatch.live';
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const configRef=doc(db,'config','live');
const defaults=[["로또 1등에 당첨된다면?","모르는 척 출근한다","바로 퇴사한다"],["평생 둘 중 하나만 할 수 있다면?","선택지 A 확인 필요","선택지 B 확인 필요"],["평생 한 계절만 산다면?","여름","겨울"],["돈 중 하나를 받는다면?","일시금 1억 원","매달 100만 원씩 10년"],["밤 11시 부장님에게 업무 카톡이 온다면?","바로 답장하기","다음 날 답장하기"],["내 마음대로 출퇴근할 수 있다면?","매일 조금 늦게 출근","매일 조금 일찍 퇴근"],["회식 자리에서 누군가 눈물이 난다면?","선택지 A 확인 필요","선택지 B 확인 필요"],["승진 승격을 하는 대신 한 가지를 포기해야 한다면?","선택지 A 확인 필요","선택지 B 확인 필요"],["연봉 2배 인상 대신 한 가지를 포기해야 한다면?","선택지 A 확인 필요","선택지 B 확인 필요"],["100억을 받는 대신 한 가지를 포기해야 한다면?","평생 게임 금지","평생 커피 금지"]];
let user=null,admin=false,active=null,room=null,roomId='',entries=[],votes=[],roomUnsubs=[],configUnsub=null,joined=false,participantName='',localVote=false;
const show=id=>$(id).classList.remove('hide'),hide=id=>$(id).classList.add('hide'),error=e=>{$('error').textContent=e?.message||String(e)},clear=()=>{$('error').textContent=''};
const questions=r=>(r?.questions||[]).map(q=>[q.text,q.a,q.b]);
const qrUrl=url=>'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);
function editor(){const q=questions(room);$('count').value=String(room?.count||10);$('editor').innerHTML='';for(let i=0;i<Number($('count').value);i++){let a=q[i]||defaults[i];let d=document.createElement('div');d.className='qedit';d.innerHTML='<b>Q'+(i+1)+'</b><input data-q="'+i+'" data-k="0" placeholder="질문"><input data-q="'+i+'" data-k="1" placeholder="선택지 A"><input data-q="'+i+'" data-k="2" placeholder="선택지 B">';$('editor').append(d);d.querySelectorAll('input').forEach((x,k)=>x.value=a[k]);}}
function counts(i){return[0,1].map(k=>votes.filter(v=>v.question===i&&v.choice===k).length)}
function scores(){const boss=entries.filter(e=>e.name==='부장님');if(boss.length!==1)return {error:boss.length?'부장님 이름이 중복되었습니다.':'부장님이 입장하지 않았습니다.'};const base=Array.from({length:room.count},(_,i)=>votes.find(v=>v.uid===boss[0].uid&&v.question===i)?.choice);const all=entries.filter(e=>e.uid!==boss[0].uid).map(e=>{const picks=Array.from({length:room.count},(_,i)=>votes.find(v=>v.uid===e.uid&&v.question===i)?.choice);return {...e,picks,score:picks.filter((v,i)=>v!==undefined&&base[i]!==undefined&&v===base[i]).length}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ko'));let last=-1,rank=0;all.forEach((e,i)=>{if(e.score!==last){rank=i+1;last=e.score}e.rank=rank});return {base,all}}
function rankTable(){if(room.status!=='finished')return '<p class="muted">게임 종료 후 전체 결과가 표시됩니다.</p>';const s=scores();if(s.error)return '<p class="error">'+esc(s.error)+'</p>';const cell=(v,b)=>'<td style="color:'+(v===undefined?'#aab5ca':v===b?'#8de0ae':'#ffa5a5')+'">'+(v===undefined?'—':(v===0?'A':'B')+(b===undefined?'':v===b?' ✓':' ✕'))+'</td>';return '<div style="overflow-x:auto"><table><thead><tr><th>순위</th><th>이름</th>'+s.base.map((_,i)=>'<th>Q'+(i+1)+'</th>').join('')+'<th>일치</th></tr></thead><tbody><tr><td>기준</td><td>부장님</td>'+s.base.map(v=>cell(v,v)).join('')+'<td>기준</td></tr>'+s.all.map(e=>'<tr><td>'+e.rank+'등</td><td>'+esc(e.name)+'</td>'+e.picks.map((v,i)=>cell(v,s.base[i])).join('')+'<td>'+e.score+'/'+room.count+'</td></tr>').join('')+'</tbody></table></div>'}
function render(){if(!room)return;const total=admin?entries.length:(room.participantCount||0);$('people').textContent='참가 '+total+'명';const i=room.current||0,q=questions(room)[i],status=room.status;const [a,b]=counts(i),n=a+b;const result='<p>A '+a+'명 ('+(n?Math.round(a/n*100):0)+'%)</p><div class="bar"><div class="fill" style="width:'+(n?a/n*100:0)+'%"></div></div><p>B '+b+'명 ('+(n?Math.round(b/n*100):0)+'%)</p><div class="bar"><div class="fill" style="width:'+(n?b/n*100:0)+'%;background:#e78c9a"></div></div>';
if(admin){$('hostStatus').textContent='상태: '+status+' / '+(i+1)+' / '+room.count+'문항 / 참가 '+total+'명';$('hostResult').innerHTML='<div class="card"><h3>'+(q?'Q'+(i+1)+'. '+esc(q[0]):'대기 중')+'</h3>'+result+'</div>';$('rankings').innerHTML=rankTable();$('start').disabled=status==='question'||status==='finished'||(status==='reveal'&&i>=room.count-1);$('reveal').disabled=status!=='question';for(const rank of [1,2,3])$('award'+rank).disabled=status!=='finished'||!!scores().error||!scores().all.some(e=>e.rank===rank);$('awardClear').disabled=status!=='finished';return}
if(!joined)return;let html='';if(room.award&&status==='finished')html='<div class="center award"><div style="font-size:60px">🎉👏🏆</div><h1>'+room.award.rank+'등 발표!</h1><div class="big">'+esc(room.award.name)+'</div><h2>축하합니다!</h2></div>';
else if(status==='lobby'||status==='draft')html='<h2>입장 완료</h2><p>사회자가 시작하기를 기다려주세요.</p>';
else if(status==='finished')html='<h2>게임 종료!</h2><p>수상자 발표를 기다려주세요.</p>';
else if(!q)html='<p>문항을 불러오는 중입니다.</p>';
else {const mine=votes.find(v=>v.question===i&&v.uid===user?.uid);html='<p class="muted">QUESTION '+(i+1)+' / '+room.count+'</p><h2>'+esc(q[0])+'</h2>';if(status==='question'){html+='<div class="choices">'+[1,2].map(k=>'<button data-choice="'+(k-1)+'" '+(mine||localVote?'disabled':'')+' class="'+(mine?.choice===k-1?'chosen':'')+'">'+(k===1?'A':'B')+'<br>'+esc(q[k])+'</button>').join('')+'</div><p>'+(mine?'선택 완료! 다음 진행을 기다려주세요.':'원하는 선택지를 눌러주세요.')+'</p>'}else html+='<h3>투표 종료</h3><p>다음 문제를 기다려주세요.</p>'}
$('playerContent').innerHTML=html;document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>cast(Number(x.dataset.choice)))}

function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function unsubscribe(){roomUnsubs.forEach(f=>f());roomUnsubs=[];entries=[];votes=[];room=null;}
function subscribe(id){if(!id||roomId===id&&roomUnsubs.length)return;unsubscribe();roomId=id;roomUnsubs.push(onSnapshot(doc(db,'rooms',id),s=>{if(!s.exists()){error('게임을 찾을 수 없습니다.');return}const old=room?.current;room=s.data();if(admin){if(old===undefined)editor();show('host')}else if(joined)show('player');localVote=old===room.current?localVote:false;render()},error));if(admin){roomUnsubs.push(onSnapshot(collection(db,'rooms',id,'entries'),s=>{entries=s.docs.map(d=>d.data());render();if(room&&room.participantCount!==entries.length)updateDoc(doc(db,'rooms',id),{participantCount:entries.length}).catch(error)},error));roomUnsubs.push(onSnapshot(collection(db,'rooms',id,'votes'),s=>{votes=s.docs.map(d=>d.data());render()},error))}else if(joined){roomUnsubs.push(onSnapshot(query(collection(db,'rooms',id,'votes'),where('uid','==',user.uid)),s=>{votes=s.docs.map(d=>d.data());render()},error))}}

async function create(){if(!admin)throw Error('관리자 로그인이 필요합니다.');const id=Math.random().toString(36).slice(2,10).toUpperCase();const q=defaults.map(x=>({text:x[0],a:x[1],b:x[2]}));await setDoc(doc(db,'rooms',id),{owner:user.uid,status:'lobby',current:0,count:10,questions:q,participantCount:0,award:null,createdAt:serverTimestamp()});await setDoc(configRef,{roomId:id,updatedAt:serverTimestamp()});subscribe(id);editor();}
async function save(){if(room?.status!=='lobby')throw Error('문항은 게임 시작 전에만 수정할 수 있습니다.');const q=defaults.map(x=>({text:x[0],a:x[1],b:x[2]}));document.querySelectorAll('[data-q]').forEach(el=>{const i=Number(el.dataset.q),k=Number(el.dataset.k);q[i][['text','a','b'][k]]=el.value.trim()});const count=Number($('count').value);if(q.slice(0,count).some(x=>!x.text||!x.a||!x.b))throw Error('모든 질문과 선택지를 입력하세요.');await updateDoc(doc(db,'rooms',roomId),{questions:q,count});alert('문항을 저장했습니다.')}
async function join(){const name=$('name').value.trim();if(!name)throw Error('이름을 입력하세요.');if(!user?.isAnonymous)throw Error('참가자 인증을 다시 시도해 주세요.');if(!active?.roomId)throw Error('아직 사회자가 게임을 만들지 않았습니다.');participantName=name;joined=true;sessionStorage.setItem('mindmatch-name',name);hide('home');show('player');const entryRef=doc(db,'rooms',active.roomId,'entries',user.uid);const existing=await getDoc(entryRef);if(existing.exists()){participantName=existing.data().name;sessionStorage.setItem('mindmatch-name',participantName)}else await setDoc(entryRef,{uid:user.uid,name,joinedAt:serverTimestamp()});subscribe(active.roomId);render()}
async function cast(choice){if(!room||room.status!=='question'||localVote)return;localVote=true;render();try{await setDoc(doc(db,'rooms',roomId,'votes',room.current+'_'+user.uid),{uid:user.uid,question:room.current,choice,createdAt:serverTimestamp()})}catch(e){localVote=false;error(e);render()}}
async function advance(){if(!room)return;if(room.status==='lobby'&&questions(room).slice(0,room.count).some(q=>q.some(x=>x.includes('확인 필요'))))throw Error('흐릿한 선택지를 사회자 화면에서 수정·저장한 뒤 시작하세요.');const i=room.status==='lobby'?0:room.current+1;if(i>=room.count)return;await updateDoc(doc(db,'rooms',roomId),{status:'question',current:i})}
function updateLink(){const url=location.origin+location.pathname;$('link').href=url;$('link').textContent=url;$('qr').innerHTML='<img alt="참가 QR" width="180" height="180" src="'+qrUrl(url)+'">'}
$('adminLink').onclick=()=>{hide('home');show('adminLogin')};$('back').onclick=()=>{hide('adminLogin');show('home')};
$('login').onclick=async()=>{clear();try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$('password').value);$('password').value=''}catch(e){error('관리자 로그인 실패: '+e.message)}};
$('join').onclick=()=>join().catch(error);$('new').onclick=()=>create().catch(error);$('save').onclick=()=>save().catch(error);$('count').onchange=editor;$('start').onclick=()=>advance().catch(error);$('reveal').onclick=()=>updateDoc(doc(db,'rooms',roomId),{status:'reveal'}).catch(error);$('finish').onclick=()=>updateDoc(doc(db,'rooms',roomId),{status:'finished',award:null}).catch(error);for(const rank of [1,2,3])$('award'+rank).onclick=()=>{const s=scores();if(s.error)return error(s.error);const winners=s.all.filter(e=>e.rank===rank);if(!winners.length)return error('해당 순위가 없습니다.');updateDoc(doc(db,'rooms',roomId),{award:{rank,name:winners.map(e=>e.name).join(', ')}}).catch(error)};$('awardClear').onclick=()=>updateDoc(doc(db,'rooms',roomId),{award:null}).catch(error);
for(let i=1;i<=10;i++)$('count').add(new Option(i+'문항',i));$('count').value='10';updateLink();
onAuthStateChanged(auth,async u=>{try{user=u;if(!u){await signInAnonymously(auth);return}admin=!u.isAnonymous&&u.email===ADMIN_EMAIL;hide('adminLogin');if(admin){hide('home');hide('player');show('host');if(active?.roomId){const s=await getDoc(doc(db,'rooms',active.roomId));if(s.exists()&&s.data().owner===u.uid){subscribe(active.roomId);return}}unsubscribe();$('hostStatus').textContent='새 게임 만들기를 눌러주세요.';editor()}else{hide('host');const name=sessionStorage.getItem('mindmatch-name');if(name&&active?.roomId){$('name').value=name;await join()}else show('home')}}catch(e){error(e)}});
configUnsub=onSnapshot(configRef,s=>{active=s.exists()?s.data():null;if(!admin&&joined&&active?.roomId&&roomId!==active.roomId){joined=false;sessionStorage.removeItem('mindmatch-name');unsubscribe();hide('player');show('home');error('새 게임이 시작되었습니다. 이름을 입력해 다시 참여해 주세요.')}if(admin&&active?.roomId&&(!roomId||roomId!==active.roomId))subscribe(active.roomId);},error);
</script></body></html>
