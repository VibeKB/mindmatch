function render(){if(!room)return;const total=room.participantCount||0;$('people').textContent='참가 '+total+'명';const i=room.current||0,q=questions(room)[i],status=room.status;const [a,b]=counts(i),n=a+b;const answered=room.responseCount||0;const progress='<div class="card vote-progress"><p><b>'+(total>0&&answered>=total?'전원 응답 완료!':'응답 완료 '+answered+' / '+total+'명')+'</b></p><div class="bar"><div class="fill" style="width:'+(total?Math.min(100,answered/total*100):0)+'%"></div></div><p class="muted small">다른 참가자의 선택은 공개되지 않습니다.</p></div>';const result='<p>A '+a+'명 ('+(n?Math.round(a/n*100):0)+'%)</p><div class="bar"><div class="fill" style="width:'+(n?a/n*100:0)+'%"></div></div><p>B '+b+'명 ('+(n?Math.round(b/n*100):0)+'%)</p><div class="bar"><div class="fill" style="width:'+(n?b/n*100:0)+'%;background:#e78c9a"></div></div>';
if(admin){playedQuestions();$('hostStatus').textContent='상태: '+status+' / '+(i+1)+' / '+room.count+'문항 / 참가 '+total+'명';$('hostResult').innerHTML='<div class="card"><h3>'+(q?'Q'+(i+1)+'. '+esc(q[0]):'대기 중')+'</h3>'+result+'</div>'+progress;$('rankings').innerHTML=rankTable();$('start').disabled=status==='question'||status==='finished'||(status==='reveal'&&i>=room.count-1)||(status==='lobby'&&(entries.length<2||entries.filter(e=>e.name==='부장님').length!==1));$('reveal').disabled=status!=='question';for(const rank of [1,2,3])$('award'+rank).disabled=status!=='finished'||!!scores().error||!scores().all.some(e=>e.rank===rank);$('awardClear').disabled=status!=='finished';return}
if(!joined)return;let html='';if(room.award&&status==='finished')html='<div class="center award"><div style="font-size:60px">🎉👏🏆</div><h1>'+room.award.rank+'등 발표!</h1><div class="big">'+esc(room.award.name)+'</div><h2>축하합니다!</h2></div>';
else if(status==='lobby'||status==='draft')html='<h2>입장 완료</h2><p>사회자가 시작하기를 기다려주세요.</p><p class="muted">참가 '+total+'명</p><div class="center"><img alt="친구에게 보여줄 참가 QR코드" width="210" height="210" style="background:white;padding:8px;border-radius:12px;max-width:100%" src="'+qrUrl(joinUrl())+'"></div><p class="center">옆 사람에게 QR코드를 보여주세요.</p><button id="shareInvite" class="secondary">참가 링크 공유하기</button>';
else if(status==='finished')html='<h2>게임 종료!</h2><p>수상자 발표를 기다려주세요.</p>';
else if(!q)html='<p>문항을 불러오는 중입니다.</p>';
else {const mine=votes.find(v=>v.question===i&&v.uid===user?.uid);html='<div class="quiz-top"><span class="quiz-number">Q'+(i+1)+' / '+room.count+'</span><div class="quiz-track"><span style="width:'+((i+1)/room.count*100)+'%"></span></div></div>'+questionArt(room.questions[i]?.scene??i)+'<h2 class="quiz-question">'+esc(q[0])+'</h2>';if(status==='question'){html+='<div class="choices">'+[1,2].map(k=>'<button data-choice="'+(k-1)+'" '+(mine||localVote?'disabled':'')+' class="'+(mine?.choice===k-1?'chosen':'')+'">'+'<span class="choice-letter">'+(k===1?'A':'B')+'</span><br>'+esc(q[k])+'</button>').join('')+'</div><p>'+(mine?'선택 완료! 다음 진행을 기다려주세요.':'원하는 선택지를 눌러주세요.')+'</p>'+progress}else html+='<h3>투표 종료</h3><p>다음 문제를 기다려주세요.</p>'+progress}
const currentVote=votes.find(v=>v.question===i&&v.uid===user?.uid);const viewKey=[roomId,status,i,room.award?.rank||'',room.award?.name||'',currentVote?.choice??'none',localVote].join('|');if(playerViewKey!==viewKey){$('playerContent').innerHTML=html;playerViewKey=viewKey}else{const existingProgress=$('playerContent').querySelector('.vote-progress');if(existingProgress){const fresh=document.createElement('div');fresh.innerHTML=progress;existingProgress.replaceWith(fresh.firstElementChild)}}if($('shareInvite'))$('shareInvite').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'이심전심 LIVE 참여',url:joinUrl()});else if(navigator.clipboard){await navigator.clipboard.writeText(joinUrl());alert('참가 링크를 복사했습니다.')}else prompt('참가 링크를 복사하세요',joinUrl())}catch(e){if(e.name!=='AbortError')error(e)}}}

$('playerContent').addEventListener('click',e=>{const btn=e.target.closest('button[data-choice]');if(!btn||btn.disabled)return;cast(Number(btn.dataset.choice))});
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function unsubscribe(){if(syncTimer){clearInterval(syncTimer);syncTimer=null}roomUnsubs.forEach(f=>f());roomUnsubs=[];if(voteUnsub){voteUnsub();voteUnsub=null}voteWatchKey='';playerViewKey='';entries=[];votes=[];room=null;}
function applyRoomSnapshot(s,id){if(id!==roomId||!s.exists())return;if(s.metadata.fromCache&&room)return;const old=room?.current;room=s.data();if(!admin&&joined)watchOwnVote(id,room.current);if(admin){if(old===undefined)editor();show('host')}else if(joined)show('player');localVote=old===room.current?localVote:false;render()}
async function refreshRoom(){if(!roomId||!user||syncBusy||document.visibilityState==='hidden')return;syncBusy=true;const id=roomId;try{const s=await getDocFromServer(doc(db,'rooms',id));applyRoomSnapshot(s,id)}catch(e){console.warn('실시간 상태 재확인 지연',e)}finally{syncBusy=false}}
function subscribe(id){if(!id||roomId===id&&roomUnsubs.length)return;unsubscribe();roomId=id;roomUnsubs.push(onSnapshot(doc(db,'rooms',id),{includeMetadataChanges:true},s=>{if(!s.exists()){error('게임을 찾을 수 없습니다.');return}applyRoomSnapshot(s,id)},error));if(admin){roomUnsubs.push(onSnapshot(collection(db,'rooms',id,'entries'),s=>{entries=s.docs.map(d=>d.data());render()},error));roomUnsubs.push(onSnapshot(collection(db,'rooms',id,'votes'),s=>{votes=s.docs.map(d=>d.data());render()},error))}syncTimer=setInterval(refreshRoom,5000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshRoom()});window.addEventListener('focus',refreshRoom);

function watchOwnVote(id,i){const key=id+'_'+i+'_'+user.uid;if(voteWatchKey===key)return;if(voteUnsub)voteUnsub();voteWatchKey=key;votes=[];voteUnsub=onSnapshot(doc(db,'rooms',id,'votes',i+'_'+user.uid),s=>{votes=s.exists()?[s.data()]:[];render()},error)}

async function create(){if(!admin)throw Error('관리자 로그인이 필요합니다.');const id=Math.random().toString(36).slice(2,10).toUpperCase();const count=Number($('questionCount').value);if(![10,15,20].includes(count))throw Error('출제 문항 수를 선택해 주세요.');const shuffled=defaults.map((x,index)=>({text:x[0],a:x[1],b:x[2],scene:index}));for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const q=shuffled.slice(0,count);await setDoc(doc(db,'rooms',id),{owner:user.uid,status:'lobby',current:0,count,questions:q,participantCount:0,responseCount:0,award:null,createdAt:serverTimestamp()});await setDoc(configRef,{roomId:id,updatedAt:serverTimestamp()});subscribe(id);editor();}

async function join(){const name=$('name').value.trim();if(!name)throw Error('이름을 입력하세요.');if(!user?.isAnonymous)throw Error('참가자 인증을 다시 시도해 주세요.');if(!active?.roomId)throw Error('아직 사회자가 게임을 만들지 않았습니다.');const id=active.roomId,entryRef=doc(db,'rooms',id,'entries',user.uid),gameRef=doc(db,'rooms',id);let finalName=name;await runTransaction(db,async tx=>{const game=await tx.get(gameRef),existing=await tx.get(entryRef);if(!game.exists())throw Error('게임방이 없습니다.');if(existing.exists()){finalName=existing.data().name;return}const data=game.data();if(data.status!=='lobby')throw Error('게임이 이미 시작되어 새 참가자를 받을 수 없습니다.');tx.set(entryRef,{uid:user.uid,name,joinedAt:serverTimestamp()});tx.update(gameRef,{participantCount:(data.participantCount||0)+1})});participantName=finalName;joined=true;sessionStorage.setItem('mindmatch-name',finalName);hide('home');show('player');subscribe(id);render()}

async function cast(choice){if(!room||room.status!=='question'||localVote)return;localVote=true;render();try{const i=room.current,id=roomId,voteRef=doc(db,'rooms',id,'votes',i+'_'+user.uid),gameRef=doc(db,'rooms',id);await runTransaction(db,async tx=>{const game=await tx.get(gameRef),existing=await tx.get(voteRef);if(existing.exists())return;if(!game.exists()||game.data().status!=='question'||game.data().current!==i)throw Error('해당 문제의 투표가 종료되었습니다.');tx.set(voteRef,{uid:user.uid,question:i,choice,createdAt:serverTimestamp()});tx.update(gameRef,{responseCount:(game.data().responseCount||0)+1})})}catch(e){localVote=false;error(e);render()}}

async function advance(){if(!room)return;if(room.status==='lobby'){if(entries.length<2)throw Error('부장님을 포함해 최소 2명이 입장해야 시작할 수 있습니다.');if(entries.filter(e=>e.name==='부장님').length!==1)throw Error('이름이 부장님인 참가자가 정확히 1명 있어야 시작할 수 있습니다.');}const i=room.status==='lobby'?0:room.current+1;if(i>=room.count)return;await updateDoc(doc(db,'rooms',roomId),{status:'question',current:i,responseCount:0})}
function updateLink(){const url=joinUrl();$('link').href=url;$('link').textContent=url;$('qr').innerHTML='<img alt="참가 QR" width="180" height="180" src="'+qrUrl(url)+'">'}
$('adminLink').onclick=()=>{hide('home');show('adminLogin')};$('back').onclick=()=>{hide('adminLogin');show('home')};
$('login').onclick=async()=>{clear();try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$('password').value);$('password').value=''}catch(e){error('관리자 로그인 실패: '+e.message)}};
$('join').onclick=()=>join().catch(error);$('new').onclick=()=>create().catch(error);$('start').onclick=()=>advance().catch(error);$('reveal').onclick=()=>updateDoc(doc(db,'rooms',roomId),{status:'reveal'}).catch(error);$('finish').onclick=()=>updateDoc(doc(db,'rooms',roomId),{status:'finished',award:null}).catch(error);for(const rank of [1,2,3])$('award'+rank).onclick=()=>{const s=scores();if(s.error)return error(s.error);const winners=s.all.filter(e=>e.rank===rank);if(!winners.length)return error('해당 순위가 없습니다.');updateDoc(doc(db,'rooms',roomId),{award:{rank,name:winners.map(e=>e.name).join(', ')}}).catch(error)};$('awardClear').onclick=()=>updateDoc(doc(db,'rooms',roomId),{award:null}).catch(error);
updateLink();
function watchConfig(){if(configUnsub){configUnsub();configUnsub=null}configUnsub=onSnapshot(configRef,async s=>{try{active=s.exists()?s.data():null;if(!admin&&joined&&active?.roomId&&roomId!==active.roomId){joined=false;sessionStorage.removeItem('mindmatch-name');unsubscribe();hide('player');show('home');error('새 게임이 시작되었습니다. 이름을 입력해 다시 참여해 주세요.')}if(admin&&active?.roomId&&roomId!==active.roomId)subscribe(active.roomId);if(!admin&&!joined&&active?.roomId){const name=sessionStorage.getItem('mindmatch-name');if(name){$('name').value=name;await join()}}}catch(e){error(e)}},error)}
onAuthStateChanged(auth,async u=>{try{user=u;if(!u){if(configUnsub){configUnsub();configUnsub=null}await signInAnonymously(auth);return}admin=!u.isAnonymous&&u.email===ADMIN_EMAIL;hide('adminLogin');if(admin){hide('home');hide('player');show('host');$('hostStatus').textContent='방 정보를 불러오는 중입니다.';editor()}else{hide('host');show('home')}watchConfig()}catch(e){error(e)}});

</script></body></html>
